name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: Branch and commit conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Branch name is feature/* or bugfix/*
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feature|bugfix)/.+ ]]; then
            echo "::error::Branch '$BRANCH' must start with feature/ or bugfix/ (see CONTRIBUTING.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Commit messages start with feat:, fix:, refactor:, chore: or docs:"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          invalid=$(git log --no-merges --format='%h %s' "$BASE_SHA..$HEAD_SHA" | grep -Ev '^[0-9a-f]+ (feat|fix|refactor|chore|docs): ' || true)
          if [[ -n "$invalid" ]]; then
            echo "::error::These commits do not follow the commit rules in CONTRIBUTING.md:"
            echo "$invalid"
            exit 1
          fi

  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests (gateway, services, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportslot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sportslot_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sportslot_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --config prisma7.config.ts
        working-directory: db
      - run: npm run test:e2e
